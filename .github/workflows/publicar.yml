# Publica la app en GitHub Pages cada vez que se suben cambios a la rama main.
# Si alguna prueba falla, no se publica nada.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, espera a que termine la anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probar-y-compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: probar-y-compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: publicacion
        uses: actions/deploy-pages@v4
